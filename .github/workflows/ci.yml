name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: tunnelcore tests
        run: ./gradlew :tunnelcore:test --console=plain

      # The pinned core release must be a real one: the build downloads it and
      # checks this hash (scripts/bump-jnilibs.sh writes both).
      - name: Check the core pin
        run: grep -Eq '^flextunnel\.releaseSha256=[0-9a-f]{64}$' gradle.properties

      - name: App unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
