# Per-repo values for the shared ../devtools scripts (see
# ../devtools/templates/devtools.conf.sample for every key).
APP_NAME=flextunnel
MAIN_ACTIVITY=dev.flexaccess.flextunnel/.MainActivity
CORE_REPO=flextunnel
CORE_GH_REPO=flexaccessdev/flextunnel

# The app version (flextunnel.versionName/versionCode) moves independently of
# the core; a bump only rewrites the release pin, and the build derives the core
# version shown in the UI from flextunnel.releaseTag.
BUMP_VERSION_MODE=core-key

# Each ABI's libflextunnel.so is built on a host with its own CPU: arm64-v8a on
# macvm (scripts/run-device.sh builds it there and fetches it back); x86_64,
# not listed, builds in ../flextunnel on this machine.
CORE_BUILD_HOSTS="arm64-v8a:macvm"
