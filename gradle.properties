org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The Rust core (libflextunnel.so, built from the sibling ../flextunnel repo by
# its build-android.sh and released as libflextunnel-android.zip). By default
# the app downloads this pinned release zip and verifies its sha256. Bump both
# together with scripts/bump-jnilibs.sh <tag>. The tag (minus "v") is also the
# core version the UI shows (BuildConfig.FLEXTUNNEL_CORE_VERSION). For local
# FFI dev set FLEXTUNNEL_LOCAL_JNILIBS=1 to use ../flextunnel/dist/android/jniLibs
# instead (see README); the UI still shows the pinned number then.
flextunnel.releaseTag=v0.0.115
flextunnel.releaseSha256=31de69e8a123b66763f78a117e423d0ee71dcc6926d6faad76dc9d9e94533406

# The app's own version, independent of the pinned flextunnel release: a core
# bump does not touch these. Bump by hand when the app changes; every Play
# upload needs a higher versionCode.
flextunnel.versionName=0.0.3
flextunnel.versionCode=3
